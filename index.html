<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Pre-launch: keep search engines out. The release build drops this line with ALLOW_INDEXING=true
         (src/lib/index-html.mjs, wired in vite.config.js); `npm run launch:check` confirms it. -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0e1611" />
    <title>Greatstone International · Building Stronger Organisations</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Practical digital transformation and AI-enabled automation. Greatstone finds where your people's time goes and sets up the work that should run itself, with your people in charge." />
    <link rel="canonical" href="%GS_SITE_ORIGIN%/" />
    <!-- Static link preview (GRE-659, plan §3.9). LinkedIn and most social crawlers do not run JavaScript, so
         a shared link shows THESE, whatever page it points at. Words: Home SEO from GRE-652 §4.1. The origin
         token is stamped at build time from VITE_SITE_ORIGIN (default greatstoneint.com, as for the sitemap), so
         the image URL is absolute: crawlers do not resolve relative ones. applyHead in App.jsx refines them per page
         for browsers and search engines that do run JavaScript. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Greatstone International" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="%GS_SITE_ORIGIN%/" />
    <meta property="og:title" content="Greatstone International · Building Stronger Organisations" />
    <meta property="og:description" content="Practical digital transformation and AI-enabled automation. Greatstone finds where your people's time goes and sets up the work that should run itself, with your people in charge." />
    <meta property="og:image" content="%GS_SITE_ORIGIN%/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Greatstone International · Building Stronger Organisations" />
    <meta name="twitter:description" content="Practical digital transformation and AI-enabled automation. Greatstone finds where your people's time goes and sets up the work that should run itself, with your people in charge." />
    <meta name="twitter:image" content="%GS_SITE_ORIGIN%/og-default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load the Montserrat CSS off the critical path: media="print" means it doesn't block first paint,
         and onload swaps it to all so it applies once fetched. display=swap keeps text visible in the
         system fallback until then (no invisible-text flash). <noscript> covers no-JS. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <!-- GRE-654: with no JavaScript the contact form cannot render, so give the address as the next step.
         Site CSS loads through JavaScript, so this block carries its own dark background for contrast. -->
    <noscript><p style="max-width:40rem;margin:4rem auto;padding:1.5rem;background:#0a0a0a;font:1rem/1.6 system-ui,sans-serif;color:#f5f5f5">This site needs JavaScript. To send us an enquiry, email <a style="color:#c8ff00" href="mailto:dx@greatstonesoftware.co.uk">dx@greatstonesoftware.co.uk</a> and we will reply.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
