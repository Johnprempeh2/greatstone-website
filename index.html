<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0e1611" />
    <title>Greatstone International · Building Stronger Organisations</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- default social card; per-page SEO refines these at runtime (see applyHead in App.jsx) -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load the Montserrat CSS off the critical path: media="print" means it doesn't block first paint,
         and onload swaps it to all so it applies once fetched. display=swap keeps text visible in the
         system fallback until then (no invisible-text flash). <noscript> covers no-JS. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <!-- GRE-654: with no JavaScript the contact form cannot render, so give the address as the next step.
         Site CSS loads through JavaScript, so this block carries its own dark background for contrast. -->
    <noscript><p style="max-width:40rem;margin:4rem auto;padding:1.5rem;background:#0a0a0a;font:1rem/1.6 system-ui,sans-serif;color:#f5f5f5">This site needs JavaScript. To send us an enquiry, email <a style="color:#c8ff00" href="mailto:dx@greatstonesoftware.co.uk">dx@greatstonesoftware.co.uk</a> and we will reply.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
