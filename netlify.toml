# greatstone-home (greatstoneint.com). The site is deployed from a local build (`netlify deploy`), not from git.
# Functions live in netlify/functions; Netlify Database migrations in netlify/database/migrations (GRE-1794).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # The root next.config.mjs (Next proof) makes Netlify add its Next.js plugin, which rejects this Vite build (GRE-2285).
  # The isolated Next deploys copy next-proof/netlify*.toml over this file, so they keep the plugin.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
