# The Next.js site (GRE-3873). A clean checkout builds it with `netlify build`, so GSAM's content-only rebuild
# (Netlify's builds API) and `scripts/deploy-site.mjs` build the same thing. With GSAM_SITE_ID set the build bakes
# the site's current GSAM release from Netlify Blobs and fails when it is missing or invalid.
# Functions live in netlify/functions; Netlify Database migrations in netlify/database/migrations (GRE-1794).
# The old Vite site's _redirects and _headers live in vite-static/ and reach only the Vite dist/.
[build]
  command = "npm run build:next"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_CATALOGUE_REQUIRED = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
