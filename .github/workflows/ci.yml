name: CI
# Build, unit tests, redirects check, edge secrets list check and row-level security check on every PR and push to main. Activates once the repo is on GitHub.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Unit tests (pricing, cart, bulk CSV)
        run: npm test
      - name: Production build (Vite, base /puck-proof/)
        run: npm run build
        env:
          # Build succeeds without these (the app guards for missing config); set them as repo
          # secrets to produce a runnable bundle in CI artifacts.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_VAT_RATE: '0.20'
      - name: Next built pages and internal links
        run: |
          npm run build:next
          npx next start --port 5181 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5181/ >/dev/null; then break; fi
            sleep 1
          done
          node next-proof/scripts/check-built-links.mjs
      - name: Legacy redirects in sync (public/_redirects)
        run: npm run redirects:check
      - name: Edge secrets list in sync (scripts/edge-secrets.json)
        run: npm run secrets:check
      - name: Row-level security on every table (supabase/migrations)
        run: npm run rls:check
      - name: Org scoping and no duplicate client credentials (supabase/migrations)
        run: npm run org-scope:check

  netlify-db-rls:
    # The Netlify Database migrations and their RLS suites (GRE-1795) on Postgres 18, the version Netlify Database
    # runs. The build-test job's npm test runs the same suites on the runner's own Postgres.
    name: Netlify Database migrations and RLS (Postgres 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Postgres 18 server binaries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-18
      - name: Migrations, auth bridge and RLS suites (netlify/tests)
        run: node --test netlify/tests/*.test.mjs
        env:
          PG_BIN: /usr/lib/postgresql/18/bin
