const probeRoot = () => (document.querySelector('.rd-drawer, .ca-drawer-scrim, .dd-pop')
  ? document.body : document.getElementById('root'));
window.__probe = () => probeOverlaps(probeRoot());
window.__fields = () => probeNativeFields(probeRoot());
window.__boxes = () => probeFragmentedBoxes(probeRoot());
window.__offscreen = () => probeOffscreen(probeRoot());
window.__spill = () => probeTextOverflow(probeRoot());
window.__ink = () => probeTextContrast(probeRoot());
window.__focus = () => probeFocus(probeRoot());
window.__names = () => probeNames(probeRoot());

// ⚠ THE RESULT CARRIES THE WIDTH IT WAS TAKEN AT. A sweep was read as a desktop pass and had
// actually run at 612px: the pane had dropped the viewport emulation on navigate, and nothing in
// the output said so. A measurement that does not report its own conditions invites being filed
// under the wrong ones, which is the same failure as a probe that reports on a state it never
// reached. It also totals what each probe LOOKED AT, because "no findings" only means something
// against "out of how many".
// ⚠ AND THE THEME IT WAS TAKEN IN. Setting `data-dd-theme` by hand before a sweep does not hold:
// the portal's own useTheme OWNS that attribute, sets it on mount from the saved choice and REMOVES
// it on unmount, so mounting any screen that carries a ThemeButton wiped it mid-run. A light sweep
// set up that way reports the attribute gone, the body still dark, and zero findings: a clean pass
// through a theme it was never in. The preference is written where the portal reads it, and the
// attribute is re-asserted after every mount because an unmount takes it away again.
// ⚠ THE INTERESTING STATES ONLY EXIST AFTER A CLICK. Every sweep so far measured screens AT REST,
// so 76 disclosures and popovers across 24 screens had never been opened while anything was
// looking: a popover that lands on top of the field below it, or a panel whose text fails contrast
// on its own surface, is invisible to a probe that never opens it.
// Buttons only. An <a> with aria-expanded would navigate, and a sweep that changes the route is
// measuring a different screen from the one it names. Bounded rounds, because opening one
// disclosure can reveal another.
// ⚠ WAIT FOR THE MOTION TO STOP, DON'T GUESS A DELAY. The first opened-state pass reported 26
// faded-text findings that do not exist: popovers fade in, and the probe measured them part way
// through, reading a cumulative opacity that was on its way to 1. At 0ms after opening: 7 findings.
// At 200ms: none. `document.getAnimations()` says exactly when there is nothing left moving, which
// beats any fixed delay, and the timeout is only there so one infinite decorative animation cannot
// hang the sweep.
window.__settle = async (ms = 900) => {
  const running = () => (document.getAnimations ? document.getAnimations() : [])
    .filter((a) => a.playState === 'running');
  await Promise.race([
    Promise.allSettled(running().map((a) => a.finished)),
    new Promise((r) => setTimeout(r, ms)),
  ]);
  // ⚠ THAT RACE SAMPLES getAnimations() ONCE, AND IT IS NOT ENOUGH. Anything that starts after the
  // sample (a staggered entrance, a disclosure the sweep opens, a remount) is never awaited, so the
  // ink probe reads an element mid-entrance and reports it as faded text. That is not theoretical:
  // a sweep of tab:Processes returned SIX "faded-text" findings at fade 0.99 with contrast ratios
  // from 5.9 to 15.1, and every one of them measured 1.0 after settling. High contrast plus a 1%
  // fade is the signature of a phantom, and phantoms are worse than no check: they teach the reader
  // to scroll past findings.
  // Finishing is deterministic where waiting is a race. An infinite animation (the session's live
  // pulse) throws on finish(), which is why the loop is bounded and the throw is swallowed.
  for (let i = 0; i < 3; i += 1) {
    const still = running();
    if (!still.length) break;
    for (const a of still) { try { a.finish(); } catch { /* infinite: the timeout above covers it */ } }
    // ⚠ NEVER A BARE requestAnimationFrame HERE. A background tab does not run rAF, so this awaited
    // a callback that never came and every settle hung forever: the sweep stopped finishing the
    // moment the harness tab was not the fronted one. Raced against a timer, which does run.
    await new Promise((r) => { const t = setTimeout(r, 32); requestAnimationFrame(() => { clearTimeout(t); r(); }); });
  }
};

// ⚠ THE SWEEP OPENED DISCLOSURES AND NEVER PRESSED ANYTHING ELSE. A band, a verdict filter, a view
// toggle: each renders a DIFFERENT screen, and only the default one was ever measured. The Enquiry
// tab alone hides five of its six bands that way, and the hypothesis register lives behind one of
// them, so it had never been laid out by any probe. `__open` covers aria-expanded; this covers the
// mutually exclusive groups, one option at a time (never combinations, which would explode).
// Returns how many states it visited, so a run can say what it actually reached.
window.__bands = async (onState) => {
  const groups = new Map();
  for (const b of document.querySelectorAll('button[aria-pressed]')) {
    const g = b.closest('[role="group"]') || b.parentElement;
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(b);
  }
  let visited = 0;
  for (const [g, btns] of groups) {
    if (btns.length < 2) continue;          // a lone toggle is a disclosure, __open has it
    for (let i = 0; i < btns.length; i += 1) {
      // ⚠ RE-QUERY. React replaces these nodes on every state change, so a held reference is stale
      // after the first click and clicking it does nothing at all: the sweep would report visiting
      // six bands while sitting on one.
      const live = [...g.querySelectorAll('button[aria-pressed]')][i];
      if (!live || live.getAttribute('aria-pressed') === 'true') continue;
      const label = (live.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 24);
      live.click();
      await window.__settle();
      visited += 1;
      if (onState) await onState(label);
    }
  }
  return visited;
};

window.__open = async (rounds = 3) => {
  let opened = 0;
  for (let i = 0; i < rounds; i += 1) {
    const shut = [...document.querySelectorAll('button[aria-expanded="false"]')];
    if (!shut.length) break;
    for (const b of shut) { try { b.click(); opened += 1; } catch { /* not ours to fix here */ } }
    await new Promise((r) => setTimeout(r, 60));
    await window.__settle();
  }
  return opened;
};

window.__theme = (t) => {
  try { localStorage.setItem('dd-theme', t === 'light' ? 'light' : 'dark'); } catch { /* fine */ }
  if (t === 'light') document.documentElement.setAttribute('data-dd-theme', 'light');
  else document.documentElement.removeAttribute('data-dd-theme');
};
window.__sweep = async (only = null, theme = null) => {
  if (theme) window.__theme(theme);
  const canFocus = document.hasFocus();
  const names = window.__screens.filter((n) => !only || only.test(n));
  // No count for the overlap probe: it returns a bare array, and its own empty-screen sentinel is
  // the coverage guard that a count would duplicate.
  const cover = { controls: 0, painted: 0, boxes: 0, spill: 0, ink: 0, focus: 0, opened: 0, openInk: 0, named: 0, bands: 0, bandInk: 0 };
  const findings = [];
  for (const name of names) {
    await window.__mount(name);
    if (theme) window.__theme(theme);
    const overlaps = window.__probe();
    const f = window.__fields(); const b = window.__boxes();
    const o = window.__offscreen(); const sp = window.__spill();
    const ink = window.__ink(); const names = window.__names();
    cover.named += names.checked || 0;
    // ⚠ ASKED ONCE, NOT SIXTY-NINE TIMES. The focus probe refuses to run in a page that does not
    // have focus, which is right, but a sweep started without it then carried the same refusal on
    // every screen and buried whatever else it found. The condition belongs to the RUN.
    const foc = canFocus ? window.__focus() : { checked: 0, findings: [] };
    cover.focus += foc.checked || 0;
    cover.controls += f.checked || 0; cover.painted += b.painted || 0;
    cover.boxes += o.checked || 0; cover.spill += sp.measured || 0;
    cover.ink += ink.measured || 0;
    for (const x of overlaps) {
      findings.push({ screen: name, probe: x.kind === 'empty-screen' ? 'mount' : 'overlap', ...x });
    }
    for (const [probe, res] of [['fields', f], ['boxes', b], ['offscreen', o], ['spill', sp], ['ink', ink], ['focus', foc], ['names', names]]) {
      for (const x of res.findings || []) findings.push({ screen: name, probe, ...x });
    }

    // ── and again in every band, verdict and view the screen offers ──
    // Tagged with the control that was pressed, because "spill on tab:Knowledge" is unactionable
    // when five of its six bands are a different screen.
    cover.bands += await window.__bands(async (label) => {
      const each = [
        ['overlap', { findings: window.__probe().filter((x) => x.kind !== 'empty-screen') }],
        ['spill', window.__spill()], ['ink', window.__ink()], ['offscreen', window.__offscreen()],
      ];
      cover.bandInk += (each[2][1].measured) || 0;
      for (const [probe, res] of each) {
        for (const x of res.findings || []) findings.push({ screen: name, probe, state: `band:${label}`, ...x });
      }
    });

    // ── and again with everything open ──
    // Tagged `state: 'open'` so a finding can be told from its at-rest twin: the same element can
    // be fine closed and wrong open, and a report that cannot say which is a report that gets
    // chased twice.
    const opened = await window.__open();
    if (opened) {
      cover.opened += opened;
      const again = [
        ['overlap', { findings: window.__probe().filter((x) => x.kind !== 'empty-screen') }],
        ['fields', window.__fields()], ['boxes', window.__boxes()],
        ['offscreen', window.__offscreen()], ['spill', window.__spill()], ['ink', window.__ink()],
      ];
      for (const [probe, res] of again) {
        for (const x of res.findings || []) findings.push({ screen: name, probe, state: 'open', ...x });
      }
      // ⚠ The opened pass needs its own volume or its "nothing found" means nothing. `opened`
      // counts disclosures clicked; this counts the text actually re-measured behind them.
      cover.openInk += again.find(([n]) => n === 'ink')[1].measured || 0;
    }
  }
  return {
    viewport: document.documentElement.clientWidth,
    // Read back from the page, never echoed from the argument: the point is what it RAN in.
    theme: document.documentElement.getAttribute('data-dd-theme') || 'dark',
    ground: getComputedStyle(document.body).backgroundColor,
    screens: names.length, cover, findings,
    // Said plainly, so a run with no focus pass cannot be read as a run that found nothing wrong.
    focusMeasured: canFocus || 'the page did not have focus: press Tab in it, then sweep again',
  };
};
</script></body></html>
