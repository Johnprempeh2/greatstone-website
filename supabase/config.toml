# Supabase project config (version-controlled). Pins the edge-function JWT settings so a fresh
# `supabase functions deploy` keeps the intended posture: each function does its OWN auth
# (Stripe signature verification on the webhook; getUser() validation on checkout/portal), so
# Supabase's gateway JWT check is disabled (= the --no-verify-jwt we deploy with).
project_id = "melnjvwmayjukpyngolv"

[functions.stripe-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-portal]
verify_jwt = false

[functions.request-quote]
verify_jwt = false

# Anonymous visitors; the function does its own bot check (Turnstile), signed session and per-IP limit.
[functions.front-door]
verify_jwt = false

# Staff-triggered + customer-triggered emailers: the gateway JWT check stays ON (a signed-in session is
# required to even reach them), and each function then does its own narrower check (staff row / own
# customer_users row) before sending anything.
[functions.notify-licence-issued]
verify_jwt = true

[functions.send-welcome-email]
verify_jwt = true

# Branded auth emails. The HTML lives in ./templates/*.html (generated by ./templates/_build.mjs).
# These customise the BODY of every transactional auth email; they work with Supabase's built-in
# email service AND with custom SMTP. To brand the SENDER (a Greatstone from-address) and lift the
# built-in rate limits, point Supabase at the existing Resend account (see docs/AUTH-EMAILS.md).
# The [auth.email.smtp] block is intentionally kept OUT of version control so no secret is committed
# and a `config push` can never break sending by referencing an unset password.
[auth.email.template.confirmation]
subject = "Confirm your Greatstone account"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Greatstone password"
content_path = "./templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Greatstone sign-in link"
content_path = "./templates/magic_link.html"

[auth.email.template.invite]
subject = "You're invited to Greatstone"
content_path = "./templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./templates/email_change.html"
